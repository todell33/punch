  configureBtn.addEventListener('click', openSettings);
  settingsSave.addEventListener('click', saveSettings);
  settingsCancel.addEventListener('click', closeSettings);
  notifyTestBtn.addEventListener('click', async () => {
    if (Notification.permission === 'default') await Notification.requestPermission();
    if (Notification.permission === 'granted') {
      new Notification('Punch', { body: 'Test — notifications are working.' });
      notifyStatus.textContent = 'Notification permission: granted ✓';
    } else {
      notifyStatus.textContent = `Notification permission: ${Notification.permission} — check browser site settings`;
    }

  weekPrev.addEventListener('click', () => { weekOffset--; renderLog(); });
  weekNext.addEventListener('click', () => { if (weekOffset < 0) { weekOffset++; renderLog(); } });

  taskSearch.addEventListener('input', () => {
    drillStory = null;
    const q = taskSearch.value.trim();
    if (!q) { hideDropdown(); return; }
    renderDropdown(search(q), q);
  });
  taskSearch.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown')  { e.preventDefault(); moveFocus(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); moveFocus(-1); }
    else if (e.key === 'Enter') {
      e.preventDefault();
      selectDropdownItem(currentResults[focusedIdx]);
    }
    else if (e.key === 'Escape') hideDropdown();
  });
  taskSearch.addEventListener('blur', () => setTimeout(hideDropdown, 160));

  chipClear.addEventListener('click', clearPick);
  startBtn.addEventListener('click', startTimer);
  stopBtn.addEventListener('click', stopTimer);
  function continueEntry(idx) {
    if (load(K.ACTIVE, null)) { toast('Stop the current timer first', 'error'); return; }
    const entry = load(K.LOG, [])[idx];
    if (!entry) return;
    const active = {
      taskId:      entry.taskId,
      taskTitle:   entry.taskTitle,
      taskType:    entry.taskType,
      parentTitle: entry.parentTitle || null,
      parentId:    entry.parentId   || null,
      startTime:   Date.now(),
    };
    save(K.ACTIVE, active);
    showActive(active);
    clearPick();
    newEntry.classList.add('hidden');
    // Switch to Timer tab so the active card is visible
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    document.querySelector('.tab-btn[data-tab="timer"]').classList.add('active');
    $('tab-timer').classList.add('active');
  }

  logBody.addEventListener('click', e => {
    const cont = e.target.closest('.continue-btn');
    const del  = e.target.closest('.delete-btn');
    const edit = e.target.closest('.edit-entry-btn');
    const save = e.target.closest('.edit-save');
    const canc = e.target.closest('.edit-cancel');
    if (cont) continueEntry(Number(cont.dataset.idx));
    if (del)  deleteEntry(Number(del.dataset.idx));
    if (edit) editEntry(Number(edit.dataset.idx));
    if (save) commitEditEntry(Number(save.dataset.idx));
    if (canc) cancelEditEntry(Number(canc.dataset.idx));
  });
  cancelStopBtn.addEventListener('click', cancelStop);

  activeNote.addEventListener('input', () => {
    const active = load(K.ACTIVE, null);
    if (!active) return;
    active.note = activeNote.value.trim() || null;
    save(K.ACTIVE, active);
  });

  startedEditBtn.addEventListener('click', startEditStartTime);
  startedTimeInput.addEventListener('change', commitEditStartTime);
  startedTimeInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') commitEditStartTime();
    if (e.key === 'Escape') cancelEditStartTime();
  });

  startTimeInput.addEventListener('change', () => {
    const ts = timeInputToTs(startTimeInput.value);
    startTimeErr.classList.add('hidden');
    if (!ts) { startOverride = null; return; }
    const minTs = getMinStartTs();
    if (minTs && ts < minTs) {
      startTimeErr.textContent = 'Overlaps previous entry';
      startTimeErr.classList.remove('hidden');
      startOverride = null;
      return;
    }
    if (ts > Date.now()) {
      startTimeErr.textContent = 'Cannot be in the future';
      startTimeErr.classList.remove('hidden');
      startOverride = null;
      return;
    }
    startOverride = ts;
  });
  stepperDown.addEventListener('click', () => adjustLoggedTime(-1));
  stepperUp.addEventListener('click',   () => adjustLoggedTime(+1));
  stepperValue.addEventListener('input', onStepperInput);
  stepperValue.addEventListener('keydown', e => { if (e.key === 'Enter') saveEntryBtn.click(); });
  saveEntryBtn.addEventListener('click', commitEntry);
  exportBtn.addEventListener('click', exportCSV);

  $('day-summary-close').addEventListener('click', closeDaySummary);
  $('day-summary-modal').addEventListener('click', e => { if (e.target === $('day-summary-modal')) closeDaySummary(); });
  $('day-summary-copy').addEventListener('click', () => {
    const rows = [...$('day-summary-table').querySelectorAll('tbody tr')];
    const lines = rows.map(tr => {
      const cells = [...tr.querySelectorAll('td')];
      const task  = cells[0].textContent.trim();
      const us    = cells[1].textContent.trim();
      const title = cells[2].textContent.trim();
      const ado   = cells[3].textContent.trim();
      const notes = cells[4].textContent.trim();
      return [task, us, title, ado, notes].filter(Boolean).join('\t');
    });
    navigator.clipboard.writeText(lines.join('\n')).then(() => toast('Copied to clipboard.', 'success'));
  });

  $('publish-btn').addEventListener('click', () => openPublish(todayKey()));
  publishCancel.addEventListener('click', closePublish);
  publishModal.addEventListener('click', e => { if (e.target === publishModal) closePublish(); });
  publishDo.addEventListener('click', () => {
    if (publishDo.textContent === 'Publish Again') { openPublish(); return; }
    doPublish();
  });
  publishBody.addEventListener('click', e => {
    const down = e.target.closest('.pub-down');
    const up   = e.target.closest('.pub-up');
    if (down) adjustPublishItem(Number(down.dataset.pidx), -getRoundMs());
    if (up)   adjustPublishItem(Number(up.dataset.pidx),   +getRoundMs());
  });

  // ── Tabs ─────────────────────────────────────────────────
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      $('tab-' + btn.dataset.tab).classList.add('active');
    });
  });

  // ── Retro ────────────────────────────────────────────────
  const RETRO_BUCKETS = [
    { key: 'well',     inputId: 'retro-well-input',     listId: 'retro-well-list' },
    { key: 'improve',  inputId: 'retro-improve-input',  listId: 'retro-improve-list' },
    { key: 'action',   inputId: 'retro-action-input',   listId: 'retro-action-list' },
    { key: 'shoutout', inputId: 'retro-shoutout-input', listId: 'retro-shoutout-list' },
  ];

  function renderRetro() {
    const items = load(K.RETRO, []);
    for (const b of RETRO_BUCKETS) {
      const list = $(b.listId);
      const bucketItems = items.filter(i => i.bucket === b.key);
      list.innerHTML = '';
      if (!bucketItems.length) {
        list.innerHTML = '<li class="retro-empty">No items yet.</li>';
        continue;
      }
      for (const item of bucketItems) {
        const li = document.createElement('li');
        li.className = 'retro-item';
        li.innerHTML = `<span class="retro-item-text">${esc(item.text)}</span><button class="retro-del" data-retro-id="${item.id}" aria-label="Delete">✕</button>`;
        list.appendChild(li);
      }
    }
  }

  function addRetroItem(bucket) {
    const b = RETRO_BUCKETS.find(x => x.key === bucket);
    if (!b) return;
    const input = $(b.inputId);
    const text = input.value.trim();
    if (!text) return;
    const items = load(K.RETRO, []);
    items.push({ id: Date.now() + Math.random(), bucket, text });
    save(K.RETRO, items);
    input.value = '';
    renderRetro();
  }

  function deleteRetroItem(id) {
    const items = load(K.RETRO, []).filter(i => String(i.id) !== String(id));
    save(K.RETRO, items);
    renderRetro();
  }

  function clearRetro() {
    if (!confirm('Clear all retro items?')) return;
    save(K.RETRO, []);
    renderRetro();
  }

  // Retro events
  for (const b of RETRO_BUCKETS) {
    const input = $(b.inputId);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') addRetroItem(b.key); });
  }
  document.querySelectorAll('[data-retro-add]').forEach(btn => {
    btn.addEventListener('click', () => addRetroItem(btn.dataset.retroAdd));
  });
  $('tab-retro').addEventListener('click', e => {
    const del = e.target.closest('.retro-del');
    if (del) deleteRetroItem(del.dataset.retroId);
  });
  $('retro-clear-btn').addEventListener('click', clearRetro);

  // ── TODO ─────────────────────────────────────────────────
  const todoSearchEl   = $('todo-search');
  const todoDropdownEl = $('todo-dropdown');
  const todoChip       = $('todo-chip');
  const todoChipId     = $('todo-chip-id');
  const todoChipTitle  = $('todo-chip-title');
  const todoChipClear  = $('todo-chip-clear');
  const todoList       = $('todo-list');

  let todoSelectedTask  = null;
  let todoFocusedIdx    = -1;
  let todoResults       = [];

  function renderTodoDropdown(results) {
    todoDropdownEl.innerHTML = '';
    todoFocusedIdx = -1;
    todoResults = results;
    if (!results.length) { todoDropdownEl.classList.add('hidden'); return; }
    for (const t of results) {
      const el = document.createElement('div');
      el.className = 'dropdown-item';
      el.innerHTML = `
        <span class="di-id">#${esc(t.id)}</span>
        <span class="di-title">${esc(t.title)}</span>
        <span class="di-type">${esc(t.type)}</span>
        ${t.parentTitle ? `<span class="di-parent">↳ ${esc(t.parentTitle)}</span>` : ''}
      `;
      el.addEventListener('mousedown', e => { e.preventDefault(); pickTodoTask(t); });
      todoDropdownEl.appendChild(el);
    }
    todoDropdownEl.classList.remove('hidden');
  }

  function hideTodoDropdown() {
    todoDropdownEl.classList.add('hidden');
    todoFocusedIdx = -1;
    todoResults = [];
  }

  function pickTodoTask(t) {
    todoSelectedTask = t;
    todoSearchEl.value = '';
    hideTodoDropdown();
    todoChipId.textContent = `#${t.id}`;
    todoChipTitle.textContent = t.title;
    todoChip.classList.remove('hidden');
    todoSearchEl.placeholder = 'Add a note (optional)…';
    todoSearchEl.focus();
  }

  function clearTodoTask() {
    todoSelectedTask = null;
    todoChip.classList.add('hidden');
    todoSearchEl.placeholder = 'Search work item or type free text…';
    todoSearchEl.value = '';
    todoSearchEl.focus();
  }

  function addTodoItem() {
    const text = todoSearchEl.value.trim();
    if (!text && !todoSelectedTask) return;
    const items = load(K.TODO, []);
    items.push({
      id:          Date.now() + Math.random(),
      text:        text || todoSelectedTask.title,
      taskId:      todoSelectedTask ? todoSelectedTask.id : null,
      taskTitle:   todoSelectedTask ? todoSelectedTask.title : null,
      parentId:    todoSelectedTask ? (todoSelectedTask.parentId || null) : null,
      parentTitle: todoSelectedTask ? (todoSelectedTask.parentTitle || null) : null,
      done:        false,
    });
    save(K.TODO, items);
    clearTodoTask();
    todoSearchEl.value = '';
    renderTodo();
  }

  function toggleTodoDone(id) {
    const items = load(K.TODO, []);
    const item = items.find(i => String(i.id) === String(id));
    if (item) item.done = !item.done;
    save(K.TODO, items);
    renderTodo();
  }

  function deleteTodoItem(id) {
    save(K.TODO, load(K.TODO, []).filter(i => String(i.id) !== String(id)));
    renderTodo();
  }

  function clearCompletedTodos() {
    save(K.TODO, load(K.TODO, []).filter(i => !i.done));
    renderTodo();
  }

  function renderTodo() {
    const all   = load(K.TODO, []);
    const open  = all.filter(i => !i.done);
    const done  = all.filter(i =>  i.done);
    const items = [...open, ...done];
    todoList.innerHTML = '';
    if (!items.length) {
      todoList.innerHTML = '<li class="todo-empty">No items yet — add one above.</li>';
      return;
    }
    for (const item of items) {
      const li = document.createElement('li');
      li.className = `todo-item${item.done ? ' done' : ''}`;
      const taskLink = item.taskId
        ? `<a href="https://dev.azure.com/storee/Storee%20Product%20Development/_workitems/edit/${item.taskId}" target="_blank" rel="noopener" class="ado-link" style="font-family:var(--mono);font-size:0.72rem;font-weight:700">#${esc(item.taskId)}</a>`
        : '';
      const parentLink = item.parentId
        ? `<a href="https://dev.azure.com/storee/Storee%20Product%20Development/_workitems/edit/${item.parentId}" target="_blank" rel="noopener" class="ado-link parent-link" style="font-size:0.72rem" title="${esc(item.parentTitle || '')}">#${esc(item.parentId)}</a>`
        : '';
      const displayTitle = item.taskId ? (item.text !== item.taskTitle ? item.text : item.taskTitle) : item.text;
      li.innerHTML = `
        <input type="checkbox" class="todo-cb" ${item.done ? 'checked' : ''} data-todo-id="${item.id}">
        <div class="todo-item-body">
          ${(taskLink || parentLink) ? `<div class="todo-item-meta">${taskLink}${parentLink}</div>` : ''}
          <div class="todo-item-title">${esc(displayTitle)}</div>
        </div>
        <button class="todo-item-del" data-todo-del="${item.id}" aria-label="Delete">✕</button>
      `;
      todoList.appendChild(li);
    }
  }

  // TODO events
  todoSearchEl.addEventListener('input', () => {
    if (todoSelectedTask) { hideTodoDropdown(); return; }
    const q = todoSearchEl.value.trim();
    if (!q) { hideTodoDropdown(); return; }
    renderTodoDropdown(search(q));
  });
  todoSearchEl.addEventListener('keydown', e => {
    if (e.key === 'Enter') { hideTodoDropdown(); addTodoItem(); return; }
    if (e.key === 'Escape') { hideTodoDropdown(); return; }
    const items = todoDropdownEl.querySelectorAll('.dropdown-item');
    if (!items.length) return;
    if (e.key === 'ArrowDown') { e.preventDefault(); todoFocusedIdx = Math.min(items.length - 1, todoFocusedIdx + 1); }
    if (e.key === 'ArrowUp')   { e.preventDefault(); todoFocusedIdx = Math.max(0, todoFocusedIdx - 1); }
    items.forEach((el, i) => el.classList.toggle('focused', i === todoFocusedIdx));
    if (e.key === 'Enter' && todoFocusedIdx >= 0) { e.preventDefault(); pickTodoTask(todoResults[todoFocusedIdx]); }
  });
  todoSearchEl.addEventListener('blur', () => setTimeout(hideTodoDropdown, 160));
  todoChipClear.addEventListener('click', clearTodoTask);
  $('todo-add-btn').addEventListener('click', addTodoItem);
  $('todo-clear-done-btn').addEventListener('click', clearCompletedTodos);
  todoList.addEventListener('change', e => {
    const cb = e.target.closest('.todo-cb');
    if (cb) toggleTodoDone(cb.dataset.todoId);
  });
  todoList.addEventListener('click', e => {
    const del = e.target.closest('.todo-item-del');
    if (del) deleteTodoItem(del.dataset.todoDel);
  });

  // ── Init ─────────────────────────────────────────────────
  function init() {
    expandedDays.add(todayKey());
    renderLog();
    renderRetro();
    renderTodo();
    setupNotifyTimer();

    const active = load(K.ACTIVE, null);
    if (active) {
      showActive(active);
      newEntry.classList.add('hidden');
    }

    const pat = getPat();
    if (!pat) {
      syncLabel.textContent = 'no PAT';
    }

    tasks = load(K.TASKS, []);
    const fetchedAt = load(K.FETCHED, 0);
    if (tasks.length && !pat) {
      syncLabel.textContent = `${tasks.length} cached`;
    } else if (tasks.length && (Date.now() - fetchedAt < TTL)) {
      syncLabel.textContent = `${tasks.length} tasks · ${fmtTime(fetchedAt)}`;
    } else {
      loadTasks(false);
    }
  }

  // ── Auth ─────────────────────────────────────────────────
  const authScreen    = $('auth-screen');
  const authTabSignin = $('auth-tab-signin');
  const authTabSignup = $('auth-tab-signup');
  const authEmail     = $('auth-email');
  const authPassword  = $('auth-password');
  const authPasswordRow = $('auth-password-row');
  const authSubmitBtn = $('auth-submit-btn');
  const authMagicBtn  = $('auth-magic-link-btn');
  const authForgotBtn = $('auth-forgot-btn');
  const authError     = $('auth-error');
  const authStatus    = $('auth-status');
  const userEmailLabel= $('user-email-label');
  const signoutBtn    = $('signout-btn');

  let authMode = 'signin'; // 'signin' | 'signup'
  let appStarted = false;

  function showAuthError(msg) {
    authStatus.classList.add('hidden');
    authError.textContent = msg;
    authError.classList.remove('hidden');
  }
  function showAuthStatus(msg) {
    authError.classList.add('hidden');
    authStatus.textContent = msg;
    authStatus.classList.remove('hidden');
  }
  function clearAuthMessages() {
    authError.classList.add('hidden');
    authStatus.classList.add('hidden');
  }
  function setAuthMode(mode) {
    authMode = mode;
    clearAuthMessages();
    authTabSignin.classList.toggle('active', mode === 'signin');
    authTabSignup.classList.toggle('active', mode === 'signup');
    authSubmitBtn.textContent = mode === 'signin' ? 'Sign in' : 'Create account';
  }
  authTabSignin.addEventListener('click', () => setAuthMode('signin'));
  authTabSignup.addEventListener('click', () => setAuthMode('signup'));

  authSubmitBtn.addEventListener('click', async () => {
    const email = authEmail.value.trim();
    const password = authPassword.value;
    if (!email || !password) { showAuthError('Enter an email and password.'); return; }
    authSubmitBtn.disabled = true;
    clearAuthMessages();
    try {
      if (authMode === 'signin') {
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if (error) throw error;
      } else {
        const { data, error } = await sb.auth.signUp({ email, password });
        if (error) throw error;
        if (data && data.user && !data.session) {
          showAuthStatus('Check your email to confirm your account, then sign in.');
        }
      }
    } catch (err) {
      showAuthError(err.message || 'Something went wrong.');
    } finally {
      authSubmitBtn.disabled = false;
    }
  });

  authMagicBtn.addEventListener('click', async () => {
    const email = authEmail.value.trim();
    if (!email) { showAuthError('Enter your email first.'); return; }
    clearAuthMessages();
    try {
      const { error } = await sb.auth.signInWithOtp({ email });
      if (error) throw error;
      showAuthStatus('Magic link sent — check your email.');
    } catch (err) {
      showAuthError(err.message || 'Could not send magic link.');
    }
  });

  authForgotBtn.addEventListener('click', async () => {
    const email = authEmail.value.trim();
    if (!email) { showAuthError('Enter your email first.'); return; }
    clearAuthMessages();
    try {
      const { error } = await sb.auth.resetPasswordForEmail(email);
      if (error) throw error;
      showAuthStatus('Password reset email sent.');
    } catch (err) {
      showAuthError(err.message || 'Could not send reset email.');
    }
  });

  signoutBtn.addEventListener('click', async () => {
    if (!confirm('Sign out of Punch?')) return;
    await sb.auth.signOut();
  });

  function clearLocalAppData() {
    for (const k of Object.values(K)) drop(k);
  }

  async function startApp() {
    if (appStarted) return;
    appStarted = true;
    document.body.classList.remove('pre-auth');
    userEmailLabel.textContent = currentUser.email || '';
    init();
  }

  sb.auth.onAuthStateChange(async (event, session) => {
    if (session && session.user) {
      currentUser = session.user;
      if (!appStarted) {
        suppressSync = true;
        clearLocalAppData();
        suppressSync = false;
        await pullFromCloud();
        await startApp();
      }
    } else {
      currentUser = null;
      appStarted = false;
      suppressSync = true;
      clearLocalAppData();
      suppressSync = false;
      document.body.classList.add('pre-auth');
      authEmail.value = '';
      authPassword.value = '';
      clearAuthMessages();
    }
  });
})();
</script>
</body>
</html>
